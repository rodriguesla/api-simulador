spring.application.name=api-simulador

# SQL Server (Produto)
spring.datasource.jdbc-url=jdbc:sqlserver://dbhackathon.database.windows.net:1433;databaseName=hack
spring.datasource.username=hack
spring.datasource.password=Password23
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# H2 (Simulacao)
spring.h2.datasource.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.h2.datasource.driver-class-name=org.h2.Driver
spring.h2.datasource.username=sa
spring.h2.datasource.password=

# JPA and Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator endpoints
management.endpoints.web.exposure.include=*

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

