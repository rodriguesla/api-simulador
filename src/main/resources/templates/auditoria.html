<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria de Requisições</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div style="margin: 20px 0; text-align: center;">
        <a href="/home" style="text-decoration: none;"><button class="back-btn">Voltar à Home</button></a>
    </div>
    <h1>Auditoria de Requisições</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Data/Hora</th>
            <th>Usuário</th>
            <th>Endpoint</th>
            <th>Dados da Requisição</th>
            <th>Status</th>
            <th>IP</th>
            <th>Erro</th>
        </tr>
        <tr th:each="log : ${logs}">
            <td th:text="${log.id}">ID</td>
            <td th:text="${log.formattedTimestamp}">Data/Hora</td>
            <td th:text="${log.username}">Usuário</td>
            <td th:text="${log.endpoint}">Endpoint</td>
            <td th:text="${log.requestData}">Dados</td>
            <td th:text="${log.responseStatus}">Status</td>
            <td th:text="${log.ipAddress}">IP</td>
            <td th:text="${log.errorMessage}">Erro</td>
        </tr>
    </table>
</body>
</html>
