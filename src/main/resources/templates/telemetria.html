<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Telemetria</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div style="margin: 20px 0;">
        <a href="/home"><button>Voltar ao Menu</button></a>
    </div>
    <h1>Telemetria - <span th:text="${telemetria.dataReferencia}">Data</span></h1>
    <table border="1">
        <tr>
            <th>Nome API</th>
            <th>Qtd Requisições</th>
            <th>Tempo Médio (ms)</th>
            <th>Tempo Mínimo (ms)</th>
            <th>Tempo Máximo (ms)</th>
            <th>% Sucesso</th>
        </tr>
        <tr th:each="endpoint : ${telemetria.listaEndpoints}">
            <td th:text="${endpoint.nomeApi}">Nome API</td>
            <td th:text="${endpoint.qtdRequisicoes}">Qtd</td>
            <td th:text="${#numbers.formatDecimal(endpoint.tempoMedio, 1, 2)}">Médio</td>
            <td th:text="${#numbers.formatDecimal(endpoint.tempoMinimo, 1, 2)}">Mínimo</td>
            <td th:text="${#numbers.formatDecimal(endpoint.tempoMaximo, 1, 2)}">Máximo</td>
            <td th:text="${#numbers.formatDecimal(endpoint.percentualSucesso, 1, 2)}">%</td>
        </tr>
    </table>
</body>
</html>
